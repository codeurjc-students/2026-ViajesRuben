name: Basic quality

on:
  workflow_dispatch:
  push:

jobs:
  backend:
    name: Backend build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile
        run: mvn -B compile
      - name: Unit tests with coverage
        run: mvn -B test -Dtest='*UnitTest'
      - name: Upload compiled classes and coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-analysis
          path: |
            backend/target/classes
            backend/target/site/jacoco/jacoco.xml
          if-no-files-found: error

  frontend:
    name: Frontend build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error

  sonar:
    name: Static code analysis (SonarQube Cloud)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download backend classes and coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-analysis
          path: backend/target
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@vX.Y.Z
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
