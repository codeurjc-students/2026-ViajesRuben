name: Full quality

on:
  workflow_dispatch:
  push:
  # FINAL (after testing), replace "push:" above with:
  # pull_request:
  #   branches: [main]

jobs:
  backend-tests:
    name: Backend unit, integration and system tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit tests
        run: mvn -B test -Dtest='*UnitTest'
      - name: Integration tests
        run: mvn -B test -Dtest='*IntegrationTest'
      - name: REST API system tests
        run: mvn -B test -Dtest='*ApiE2ETest'

  frontend-unit-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - run: npm ci
      - run: npm run test:coverage

  frontend-integration-and-system-tests:
    name: Frontend integration and system tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: tripplanner
        ports: ["3307:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Start backend
        working-directory: backend
        run: |
          mvn -B package -DskipTests
          nohup java -jar target/*.jar > backend.log 2>&1 &
          npx -y wait-on http://localhost:8080/api/trips --timeout 120000
      - name: Start frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npm run preview -- --port 5173 > frontend.log 2>&1 &
          npx -y wait-on http://localhost:5173 --timeout 60000
      - name: Client-server integration tests
        working-directory: frontend
        run: npm run test:int
      - name: UI system tests (Selenium)
        working-directory: backend
        run: mvn -B test -Dtest='*UiE2ETest'
