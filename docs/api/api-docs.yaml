openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/trips:
    get:
      tags:
      - trip-controller
      operationId: getTrips
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripDTO"
components:
  schemas:
    TripDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        destination:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
