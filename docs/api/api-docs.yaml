openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
  - url: https://localhost
    description: Generated server url
paths:
  /api/v1/users/{id}:
    get:
      tags:
        - user-controller
      summary: Get one's own profile
      description:
        "Only the logged-in user can read their own profile. `avatarId`\
        \ is null without avatar; otherwise the picture is at `GET /api/v1/images/{avatarId}`."
      operationId: getProfile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The profile
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/UserDTO"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: It is another user's profile
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No user has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - user-controller
      summary: Edit one's own name and email
      description:
        Same rules as at registration. The session keeps working after
        an email change. The administrator's details come from the configuration and
        cannot be edited.
      operationId: updateProfile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          description: The updated profile
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/UserDTO"
        "400":
          description: Missing or invalid name or email
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "It is another user's profile, or the administrator's"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No user has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The email is already registered
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/{id}/password:
    put:
      tags:
        - user-controller
      summary: Change one's own password
      description:
        Requires the current password; the new one has 8 to 72 characters.
        Sessions already open stay valid until their token expires.
      operationId: changePassword
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "204":
          description: The password was changed
        "400":
          description: "The current password is incorrect, or the new one is invalid"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "It is another user's profile, or the administrator's"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No user has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/{id}/avatar:
    get:
      tags:
        - user-controller
      summary: Get the bytes of a user's avatar
      description:
        "Any logged-in user. Not cached, because it changes when the avatar\
        \ is replaced; the SPA uses `GET /api/v1/images/{avatarId}` instead."
      operationId: getAvatar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "The avatar, with its `Content-Type`"
          content:
            image/*: {}
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No user has that id, or the user has no avatar"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - user-controller
      summary: Upload or replace one's own avatar
      description:
        "Multipart form with the picture in the `file` part: JPEG, PNG\
        \ or WebP up to the configured size. The previous avatar is deleted."
      operationId: replaceAvatar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "201":
          description: The user had no avatar; `Location` is the avatar URL
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ImageDTO"
        "200":
          description: The previous avatar was replaced
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ImageDTO"
        "400":
          description: "Missing, empty or not a JPEG, PNG or WebP image"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: It is another user's profile
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No user has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The image is too large
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - user-controller
      summary: Delete one's own avatar
      description: Also answers 204 when there was no avatar.
      operationId: deleteAvatar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: The user has no avatar now
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: It is another user's profile
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No user has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/trips/{tripId}/activities/{activityId}:
    get:
      tags:
        - activity-controller
      summary: Get an activity by id
      description:
        "Only the trip's creator. `imageId` is null without picture; otherwise\
        \ the picture is at `GET /api/v1/images/{imageId}`."
      operationId: getActivity
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The activity
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ActivityDTO"
        "400":
          description: An id is not a number
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The trip belongs to another user
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No trip has that id, or it has no such activity"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - activity-controller
      summary: Replace an activity's details
      description:
        Only the trip's creator. Every field is replaced; the picture is
        not changed.
      operationId: updateActivity
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityRequest"
        required: true
      responses:
        "200":
          description: The updated activity
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ActivityDTO"
        "400":
          description:
            "Missing or invalid fields, or the date is outside the trip's\
            \ dates"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The trip belongs to another user
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No trip has that id, or it has no such activity"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - activity-controller
      summary: Delete an activity
      description: Only the trip's creator. The picture is deleted with the activity.
      operationId: deleteActivity
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: The activity was deleted
        "400":
          description: An id is not a number
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The trip belongs to another user
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No trip has that id, or it has no such activity"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/trips/{tripId}/activities/{activityId}/image:
    get:
      tags:
        - activity-controller
      summary: Get the bytes of an activity's picture
      description:
        "Only the trip's creator. Not cached, because it changes when the\
        \ picture is replaced; the SPA uses `GET /api/v1/images/{imageId}` instead."
      operationId: getActivityImage
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "The picture, with its `Content-Type`"
          content:
            image/*: {}
        "400":
          description: An id is not a number
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The trip belongs to another user
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No such trip or activity, or the activity has no picture"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - activity-controller
      summary: Upload or replace an activity's picture
      description:
        "Only the trip's creator. Multipart form with the picture in the\
        \ `file` part: JPEG, PNG or WebP up to the configured size. The previous picture\
        \ is deleted."
      operationId: replaceActivityImage
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "201":
          description: The activity had no picture; `Location` is the picture URL
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ImageDTO"
        "200":
          description: The previous picture was replaced
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ImageDTO"
        "400":
          description: "Missing, empty or not a JPEG, PNG or WebP image"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The trip belongs to another user
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No trip has that id, or it has no such activity"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The image is too large
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - activity-controller
      summary: Delete an activity's picture
      description: Only the trip's creator. Also answers 204 when there was no picture.
      operationId: deleteActivityImage
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: The activity has no picture now
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The trip belongs to another user
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No trip has that id, or it has no such activity"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/trips/{id}:
    get:
      tags:
        - trip-controller
      summary: Get a trip by id
      description:
        "Only the creator. `coverImageId` is null without cover; otherwise\
        \ the picture is at `GET /api/v1/images/{coverImageId}`."
      operationId: getTrip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The trip
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TripDTO"
        "400":
          description: The id is not a number
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The trip belongs to another user
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No trip has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - trip-controller
      summary: Replace a trip's details
      description:
        "Only the creator. Every field is replaced; the cover is not changed.\
        \ New dates may leave activities outside them: that is not an error, they\
        \ are reported by `GET /api/v1/trips/{id}/conflicts`."
      operationId: updateTrip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripRequest"
        required: true
      responses:
        "200":
          description: The updated trip
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TripDTO"
        "400":
          description:
            "Missing or invalid fields, or the end date is before the start\
            \ date"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The trip belongs to another user
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No trip has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - trip-controller
      summary: Delete a trip
      description: Only the creator. The cover image is deleted with the trip.
      operationId: deleteTrip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: The trip was deleted
        "400":
          description: The id is not a number
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The trip belongs to another user
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No trip has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/trips/{id}/cover:
    get:
      tags:
        - trip-controller
      summary: Get the bytes of a trip's cover
      description:
        "Only the creator. Not cached, because it changes when the cover\
        \ is replaced; the SPA uses `GET /api/v1/images/{coverImageId}` instead."
      operationId: getCover
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "The cover, with its `Content-Type`"
          content:
            image/*: {}
        "400":
          description: The id is not a number
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The trip belongs to another user
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "No trip has that id, or the trip has no cover"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - trip-controller
      summary: Upload or replace a trip's cover
      description:
        "Only the creator. Multipart form with the picture in the `file`\
        \ part: JPEG, PNG or WebP up to the configured size. The previous cover is\
        \ deleted."
      operationId: replaceCover
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "201":
          description: The trip had no cover; `Location` is the cover URL
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ImageDTO"
        "200":
          description: The previous cover was replaced
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ImageDTO"
        "400":
          description: "Missing, empty or not a JPEG, PNG or WebP image"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The trip belongs to another user
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No trip has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The image is too large
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - trip-controller
      summary: Delete a trip's cover
      description: Only the creator. Also answers 204 when there was no cover.
      operationId: deleteCover
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: The trip has no cover now
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The trip belongs to another user
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No trip has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/users/{id}:
    put:
      tags:
        - admin-user-controller
      summary: Edit a user's name and email
      description:
        "Administrator only. Same rules as at registration: the email is\
        \ stored in lower case and must not belong to another account or to the administrator."
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          description: The updated user
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/AdminUserDTO"
        "400":
          description: Missing or invalid name or email
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description:
            "The caller is not the administrator, or the target is the\
            \ administrator's own account"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No user has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The email is already registered
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/users/{id}/status:
    put:
      tags:
        - admin-user-controller
      summary: Block or unblock a user
      description:
        Administrator only. `BLOCKED` stops the user logging in and rejects
        their open session on its next request; `ACTIVE` restores access. Setting
        the status the user already has changes nothing.
      operationId: changeStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusRequest"
        required: true
      responses:
        "200":
          description: The user with the new status
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/AdminUserDTO"
        "400":
          description: Missing or unknown status
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description:
            "The caller is not the administrator, or the target is the\
            \ administrator's own account"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No user has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users:
    post:
      tags:
        - user-controller
      summary: Register a new account
      description:
        "Public. The new user is always a regular user and is not logged\
        \ in: call `POST /api/v1/auth/login` afterwards. The `Location` header is\
        \ the URL of the new user's profile."
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: The account was created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/UserDTO"
        "400":
          description: "Missing or invalid name, email or password"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The email is already registered
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/trips:
    get:
      tags:
        - trip-controller
      summary: List one's own trips
      description:
        "Only the trips the logged-in user created. Paginated: `?page=0&size=10`\
        \ (10 per page by default, 50 at most). Sorted by start date by default; `sort`\
        \ accepts `id`, `name`, `destination`, `startDate`, `endDate` and `createdAt`."
      operationId: getTrips
      parameters:
        - name: page
          in: query
          description: Zero-based page index (0..N)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: The size of the page to be returned
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
        - name: sort
          in: query
          description:
            "Sorting criteria in the format: property,(asc|desc). Default\
            \ sort order is ascending. Multiple sort criteria are supported."
          required: false
          schema:
            type: array
            default:
              - "startDate,ASC"
              - "id,ASC"
            items:
              type: string
      responses:
        "200":
          description: One page of trips
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/PageDTOTripDTO"
        "400":
          description: "Invalid page, size or sort parameter"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - trip-controller
      summary: Create a trip
      description:
        "The logged-in user becomes the creator. Dates are `yyyy-MM-dd`\
        \ and the end must not be before the start. `budget` and `description` are\
        \ optional. The cover is set afterwards with `PUT /api/v1/trips/{id}/cover`.\
        \ The `Location` header is the URL of the new trip."
      operationId: createTrip
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripRequest"
        required: true
      responses:
        "201":
          description: The trip was created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TripDTO"
        "400":
          description:
            "Missing or invalid fields, or the end date is before the start\
            \ date"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/trips/{tripId}/activities:
    get:
      tags:
        - activity-controller
      summary: List a trip's activities
      description:
        "Only the trip's creator. Paginated: `?page=0&size=10` (50 at most),\
        \ sorted by date and start time by default; activities without a start time\
        \ come first on their day. `date=yyyy-MM-dd` keeps only the activities of\
        \ that day. `sort` accepts `id`, `date`, `startTime`, `name`, `cost` and `createdAt`."
      operationId: getActivities
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: date
          in: query
          description: "Only the activities of this day, `yyyy-MM-dd`"
          required: false
          schema:
            type: string
            format: date
        - name: page
          in: query
          description: Zero-based page index (0..N)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: The size of the page to be returned
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
        - name: sort
          in: query
          description:
            "Sorting criteria in the format: property,(asc|desc). Default\
            \ sort order is ascending. Multiple sort criteria are supported."
          required: false
          schema:
            type: array
            default:
              - "date,ASC"
              - "startTime,ASC"
              - "id,ASC"
            items:
              type: string
      responses:
        "200":
          description: One page of activities
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/PageDTOActivityDTO"
        "400":
          description: "Invalid trip id, date, page, size or sort parameter"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The trip belongs to another user
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No trip has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - activity-controller
      summary: Create an activity
      description:
        "Only the trip's creator, who becomes the author. `date` must be\
        \ within the trip's dates; times are `HH:mm`, the end strictly after the start\
        \ and not without a start. The picture is set afterwards with `PUT .../{activityId}/image`.\
        \ The `Location` header is the URL of the new activity."
      operationId: createActivity
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityRequest"
        required: true
      responses:
        "201":
          description: The activity was created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ActivityDTO"
        "400":
          description:
            "Missing or invalid fields, or the date is outside the trip's\
            \ dates"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The trip belongs to another user
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No trip has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/images:
    post:
      tags:
        - image-controller
      summary: Upload an image
      description:
        "Multipart form with the picture in the `file` part: JPEG, PNG\
        \ or WebP up to the configured size. The `Location` header has the URL to\
        \ read it."
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "201":
          description: Image stored
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ImageDTO"
        "400":
          description: "Missing, empty or not a JPEG, PNG or WebP image"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The image is too large
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout:
    post:
      tags:
        - auth-controller
      summary: Log out
      description: Clears the `AuthToken` cookie.
      operationId: logout
      responses:
        "204":
          description: Logged out; the cookie is cleared
  /api/v1/auth/login:
    post:
      tags:
        - auth-controller
      summary: Log in with email and password
      description:
        "Sets the HttpOnly, Secure `AuthToken` cookie that authenticates\
        \ later requests."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Logged in; the cookie is set
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/UserDTO"
        "400":
          description: Invalid body
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong email or password
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Correct credentials but the account is blocked
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/trips/{tripId}/conflicts:
    get:
      tags:
        - conflict-controller
      summary: List a trip's itinerary conflicts
      description:
        "Only the trip's creator. Warnings, never errors: `overlaps` are\
        \ pairs of activities of the same day whose times intersect (touching times\
        \ do not; activities without start and end time are ignored), `outsideDates`\
        \ are activities before the trip starts or after it ends, and `budget` is\
        \ set only when the total cost is above the trip's budget (null otherwise).\
        \ Not paginated: it is one small report."
      operationId: getConflicts
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "The conflicts, all empty when there are none"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TripConflictsDTO"
        "400":
          description: The trip id is not a number
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The trip belongs to another user
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No trip has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/trips/{tripId}/activities/cost:
    get:
      tags:
        - activity-controller
      summary: Get what a trip's activities cost
      description:
        "Only the trip's creator. `totalCost` is the sum of the costs of\
        \ all the activities (0 without any cost) and `remainingBudget` is the trip's\
        \ budget minus that total, negative when the activities cost more and null\
        \ when the trip has no budget."
      operationId: getCost
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The total cost and the remaining budget
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TripCostDTO"
        "400":
          description: The trip id is not a number
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The trip belongs to another user
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No trip has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/trips/examples:
    get:
      tags:
        - example-trip-controller
      summary: List the example trips
      description:
        "Public, no login. The trips the administrator created, each with\
        \ the first activity of its first three days (`firstDays`; days without activities\
        \ are left out). Paginated: `?page=0&size=10` (50 at most), sorted by start\
        \ date by default; `sort` accepts `id`, `name`, `destination`, `startDate`,\
        \ `endDate` and `createdAt`."
      operationId: getExamples
      parameters:
        - name: page
          in: query
          description: Zero-based page index (0..N)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: The size of the page to be returned
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
        - name: sort
          in: query
          description:
            "Sorting criteria in the format: property,(asc|desc). Default\
            \ sort order is ascending. Multiple sort criteria are supported."
          required: false
          schema:
            type: array
            default:
              - "startDate,ASC"
              - "id,ASC"
            items:
              type: string
      responses:
        "200":
          description: One page of example trips
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/PageDTOExampleTripDTO"
        "400":
          description: "Invalid page, size or sort parameter"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/trips/examples/{id}:
    get:
      tags:
        - example-trip-controller
      summary: Get an example trip by id
      description:
        "Public, no login. Only trips the administrator created; any other\
        \ id is 404."
      operationId: getExample
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The example trip
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TripDTO"
        "400":
          description: The id is not a number
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No example trip has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/trips/examples/{id}/activities:
    get:
      tags:
        - example-trip-controller
      summary: List an example trip's activities
      description:
        "Public, no login. Paginated like `GET /api/v1/trips/{tripId}/activities`:\
        \ `?page=0&size=10`, sorted by date and start time by default, `date=yyyy-MM-dd`\
        \ keeps only the activities of that day."
      operationId: getExampleActivities
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: date
          in: query
          description: "Only the activities of this day, `yyyy-MM-dd`"
          required: false
          schema:
            type: string
            format: date
        - name: page
          in: query
          description: Zero-based page index (0..N)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: The size of the page to be returned
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
        - name: sort
          in: query
          description:
            "Sorting criteria in the format: property,(asc|desc). Default\
            \ sort order is ascending. Multiple sort criteria are supported."
          required: false
          schema:
            type: array
            default:
              - "date,ASC"
              - "startTime,ASC"
              - "id,ASC"
            items:
              type: string
      responses:
        "200":
          description: One page of activities
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/PageDTOActivityDTO"
        "400":
          description: "Invalid trip id, date, page, size or sort parameter"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No example trip has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/images/{id}:
    get:
      tags:
        - image-controller
      summary: Get the bytes of an image
      description: "Public, so `<img>` tags can use it."
      operationId: getImage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "The image, with its `Content-Type` and cache headers"
          content:
            image/*: {}
        "400":
          description: The id is not a valid UUID
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No image has that id
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/me:
    get:
      tags:
        - auth-controller
      summary: Get the logged-in user
      operationId: me
      responses:
        "200":
          description: The user of the `AuthToken` cookie
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/UserDTO"
        "401":
          description:
            "Missing, invalid or expired cookie, or the account is blocked;\
            \ the cookie is cleared"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/users:
    get:
      tags:
        - admin-user-controller
      summary: List and search the users
      description:
        "Administrator only. Regular users, not the administrator's own\
        \ account. `search` keeps the users whose name or email contains the text,\
        \ ignoring case. Paginated: `?page=0&size=10` (10 per page by default, 50\
        \ at most). Sorted by name by default; `sort` accepts `id`, `name`, `email`\
        \ and `registrationDate`."
      operationId: getUsers
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Zero-based page index (0..N)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: The size of the page to be returned
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
        - name: sort
          in: query
          description:
            "Sorting criteria in the format: property,(asc|desc). Default\
            \ sort order is ascending. Multiple sort criteria are supported."
          required: false
          schema:
            type: array
            default:
              - "name,ASC"
              - "id,ASC"
            items:
              type: string
      responses:
        "200":
          description: One page of users
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/PageDTOAdminUserDTO"
        "400":
          description: "Invalid page, size or sort parameter"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not logged in
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not the administrator
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
      required:
        - email
        - name
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - USER
            - ADMIN
        avatarId:
          type: string
          format: uuid
        registrationDate:
          type: string
          format: date
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          maxLength: 72
          minLength: 8
      required:
        - currentPassword
        - newPassword
    ImageDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        contentType:
          type: string
        size:
          type: integer
          format: int64
    ActivityRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time-local
        endTime:
          type: string
          format: time-local
        location:
          type: string
          maxLength: 200
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        cost:
          type: number
          minimum: 0.00
        category:
          type: string
          enum:
            - SIGHTSEEING
            - FOOD
            - TRANSPORT
            - ACCOMMODATION
            - LEISURE
            - OTHER
      required:
        - date
        - name
    ActivityDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tripId:
          type: integer
          format: int64
        authorId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        location:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time-local
        endTime:
          type: string
          format: time-local
        cost:
          type: number
        category:
          type: string
          enum:
            - SIGHTSEEING
            - FOOD
            - TRANSPORT
            - ACCOMMODATION
            - LEISURE
            - OTHER
        imageId:
          type: string
          format: uuid
    TripRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        destination:
          type: string
          maxLength: 100
          minLength: 0
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        budget:
          type: number
          minimum: 0.00
        description:
          type: string
          maxLength: 2000
          minLength: 0
      required:
        - destination
        - endDate
        - name
        - startDate
    TripDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        creatorId:
          type: integer
          format: int64
        name:
          type: string
        destination:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        budget:
          type: number
        description:
          type: string
        coverImageId:
          type: string
          format: uuid
    AdminUserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - BLOCKED
        registrationDate:
          type: string
          format: date
    UserStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
            - ACTIVE
            - BLOCKED
      required:
        - status
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
        password:
          type: string
          maxLength: 72
          minLength: 8
      required:
        - email
        - name
        - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    PageDTOTripDTO:
      type: object
      properties:
        content:
