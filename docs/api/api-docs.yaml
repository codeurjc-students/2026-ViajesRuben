openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
  - url: https://localhost
    description: Generated server url
paths:
  /api/v1/auth/logout:
    post:
      tags:
        - auth-controller
      summary: Log out
      description: Clears the `AuthToken` cookie.
      operationId: logout
      responses:
        "204":
          description: Logged out; the cookie is cleared
  /api/v1/auth/login:
    post:
      tags:
        - auth-controller
      summary: Log in with email and password
      description:
        "Sets the HttpOnly, Secure `AuthToken` cookie that authenticates\
        \ later requests."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Logged in; the cookie is set
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/UserDTO"
        "400":
          description: Invalid body
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong email or password
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Correct credentials but the account is blocked
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/trips:
    get:
      tags:
        - trip-controller
      operationId: getTrips
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripDTO"
  /api/v1/auth/me:
    get:
      tags:
        - auth-controller
      summary: Get the logged-in user
      operationId: me
      responses:
        "200":
          description: The user of the `AuthToken` cookie
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/UserDTO"
        "401":
          description:
            "Missing, invalid or expired cookie, or the account is blocked;\
            \ the cookie is cleared"
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - USER
            - ADMIN
    TripDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        destination:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
