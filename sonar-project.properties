sonar.organization=codeurjc-students
sonar.projectKey=codeurjc-students_2026-ViajesRuben
sonar.projectName=2026-ViajesRuben

# Source code (backend + frontend)
sonar.sources=backend/src/main/java,frontend/src
sonar.exclusions=frontend/src/**/*.test.jsx,frontend/src/setupTests.js

# Test code (backend + frontend)
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=backend/src/test/java/**/*,frontend/src/**/*.test.jsx,frontend/src/setupTests.js

# Java compiled classes (required to analyze Java)
sonar.java.binaries=backend/target/classes

# Coverage reports
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.exclusions=**/*Application.java,**/DataLoader.java,frontend/src/main.jsx