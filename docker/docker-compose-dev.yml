# TripMate development: uses the image built locally (docker build -f docker/Dockerfile -t rubenruiz7/tripmate:dev .).
# Everything is configured with environment variables; the defaults make `docker compose up` work as it is.
name: tripmate-dev

services:
  db:
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tripmate}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # Over TCP, so it only succeeds once the real server is up and not during the initialization phase.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    image: rubenruiz7/tripmate:dev
    ports:
      - "443:443"
    sysctls:
      # Lets the non-root user of the image listen on port 443 inside the container.
      net.ipv4.ip_unprivileged_port_start: 0
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-tripmate}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-password}}
      SAMPLE_DATA: ${SAMPLE_DATA:-true}
      # Password of the sample users (development only); they exist while SAMPLE_DATA is true.
      SAMPLE_USERS_PASSWORD: ${SAMPLE_USERS_PASSWORD:-Demo-2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tripmate.com}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      # BCrypt hash of the development password "admin"; replace it outside development.
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-$$2a$$10$$opop/gseD0EqqQJ4WJcxSeasiIejoCJni6fpKYxNFfDSgyVxq6VMS}
      # Development key only; replace it outside development.
      JWT_SECRET: ${JWT_SECRET:-IqlIb/uwom5HUyTyHj+6CFj/Dj9htDhTQWs2vU3/4HA=}
      SSL_KEYSTORE: ${SSL_KEYSTORE:-classpath:keystore.p12}
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:-password}
      # Outgoing email (invitations). By default it goes to the mailpit service below; set MAIL_HOST and the
      # credentials of a real SMTP server to send real emails (see docs/execution.md).
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: "${MAIL_FROM:-TripMate <no-reply@tripmate.local>}"
      # Address that the links in the emails start with; it must be reachable from where the email is read.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://localhost}

  mailpit:
    # Test inbox: it catches every email the application sends, so none reaches a real person.
    # Web inbox at http://localhost:8025; its SMTP port (1025) is only reachable by `app`.
    image: axllent/mailpit:v1.33.1
    ports:
      - "8025:8025"

volumes:
  db-data:
