spring.application.name=backend

# Same development keystore as the application; the port is random in the system tests.
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=password
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tripmate

# Test administrator; the BCrypt hash below is for the password "Admin-test-1".
app.admin.email=admin@test.tripmate.com
app.admin.name=Test Administrator
app.admin.password-hash=$2a$10$XhjWpcFLhJeK6H3GAQf.AuF9gCgfja/kxik3Xf7.ESyTcHp7mKE8a

# Test-only JWT key
app.jwt.secret=QaaQj3xxiZt4l9E8wSVdofx96FjjBOwG6Y95zDIrTng=
app.jwt.expiration=PT1H

# The datasource comes from the Testcontainers @ServiceConnection; tests always start from a clean schema.
spring.jpa.hibernate.ddl-auto=create-drop

# Emails go to the GreenMail server of the tests that read them (port 3025); anywhere else nothing listens
# and the send fails quickly, which is logged and never affects the request.
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=2000
spring.mail.properties.mail.smtp.writetimeout=2000
app.mail.from=TripMate Test <no-reply@test.tripmate.com>
app.mail.public-url=https://tripmate.test

# The tests create their own data.
app.sample-data.enabled=false

# Same pagination limit as the application.
spring.data.web.pageable.max-page-size=50

# Same image limits as the application.
app.images.max-size=5MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
