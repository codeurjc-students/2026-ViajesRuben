spring.application.name=backend

# Same development keystore as the application; the port is random in the system tests.
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=password
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tripmate

# The datasource comes from the Testcontainers @ServiceConnection; tests always start from a clean schema.
spring.jpa.hibernate.ddl-auto=create-drop
