spring.application.name=backend

# Same development keystore as the application; the port is random in the system tests.
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=password
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tripmate

# Test administrator; the BCrypt hash below is for the password "Admin-test-1".
app.admin.email=admin@test.tripmate.com
app.admin.name=Test Administrator
app.admin.password-hash=$2a$10$XhjWpcFLhJeK6H3GAQf.AuF9gCgfja/kxik3Xf7.ESyTcHp7mKE8a

# Test-only JWT key
app.jwt.secret=QaaQj3xxiZt4l9E8wSVdofx96FjjBOwG6Y95zDIrTng=
app.jwt.expiration=PT1H

# The datasource comes from the Testcontainers @ServiceConnection; tests always start from a clean schema.
spring.jpa.hibernate.ddl-auto=create-drop

# The tests create their own data.
app.sample-data.enabled=false

# Same pagination limit as the application.
spring.data.web.pageable.max-page-size=50
