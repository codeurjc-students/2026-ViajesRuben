spring.application.name=backend

# HTTPS on 443 with the self-signed development keystore; production overrides it through the environment.
server.port=${SERVER_PORT:443}
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:password}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tripmate

# The only administrator. The default hash is BCrypt for the development password "admin"; production must
# override ADMIN_PASSWORD_HASH.
app.admin.email=${ADMIN_EMAIL:admin@tripmate.com}
app.admin.name=${ADMIN_NAME:Administrator}
app.admin.password-hash=${ADMIN_PASSWORD_HASH:$2a$10$opop/gseD0EqqQJ4WJcxSeasiIejoCJni6fpKYxNFfDSgyVxq6VMS}

# JWT signing key (Base64, at least 32 bytes) and token lifetime. The default key is for development only;
# production must override JWT_SECRET.
app.jwt.secret=${JWT_SECRET:IqlIb/uwom5HUyTyHj+6CFj/Dj9htDhTQWs2vU3/4HA=}
app.jwt.expiration=${JWT_EXPIRATION:PT24H}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/tripmate}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Pagination: at most 50 items per page, whatever ?size= asks for.
spring.data.web.pageable.max-page-size=50

# Sample trips for development; the tests create their own data.
app.sample-data.enabled=${SAMPLE_DATA:true}

# Uploaded images: JPEG, PNG or WebP up to IMAGE_MAX_SIZE; the multipart limits are a hard cap above it.
app.images.max-size=${IMAGE_MAX_SIZE:5MB}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
